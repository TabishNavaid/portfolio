  <script>
    /*
      Keep broken addresses and broken boot files on the same designed page.
      The useful detail still reaches the console; visitors never have to
      decipher a filename or a half-mounted profile.
    */
    window.PortfolioFail = function (detail) {
      if (window.console && console.error) console.error('[portfolio]', detail);
      if (location.pathname !== '/404.html') location.replace('/404.html');
    };

    /* A downloaded script can still fail while it is being parsed or run.
       Resource onerror does not cover that case, so catch first-party script
       failures here before they can leave a blank or half-working screen. */
    window.addEventListener('error', function (event) {
      if (!event.filename) return;
      const source = new URL(event.filename, location.href);
      if (source.origin === location.origin && source.pathname.includes('/js/')) {
        window.PortfolioFail('a site script stopped unexpectedly');
      }
    });

    (function guardPublicAddress() {
      const modes = ['brief', 'meadow', 'field-trip'];
      const params = new URLSearchParams(location.search);
      const asked = params.get('mode');
      const validPath = location.pathname === '/' || location.pathname === '/index.html';
      const validMode = !params.has('mode') || modes.includes(asked);

      /* This also covers hosts configured to rewrite an unknown route to
         index.html instead of serving 404.html themselves. */
      if (!validPath || !validMode) window.PortfolioFail('unknown public address');
    })();
  </script>
